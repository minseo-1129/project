<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForMe · Screens</title>
<style>
html,body{margin:0;height:100%;background:#f4f5f8}
body{display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%;max-height:100%;object-fit:contain}
</style></head>
<body>
<img id="screen" alt="">
<script>
// The portfolio shell opens this page with ?portfolioState=<screen id>.
const screens = {
  hero: ['assets/screens/01-hero.jpg', '아이용 태블릿 메인 화면과 부모 앱의 약속 수행 현황'],
  promises: ['assets/screens/02-promises.jpg', '약속 정하기: 뽀미가 추천한 약속 중 3가지를 고르는 화면'],
  doing: ['assets/screens/03-doing.jpg', '실행하기: 정한 시간에 약속을 수행하는 화면'],
  stars: ['assets/screens/04-stars.jpg', '점검하기: 지킨 약속만큼 모은 별'],
};
const [src, alt] = screens[new URLSearchParams(location.search).get('portfolioState')] || screens.hero;
const image = document.getElementById('screen');
image.src = src;
image.alt = alt;
</script>
</body></html>
