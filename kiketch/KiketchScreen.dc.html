<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet"><style>
body{margin:0;background:#e9e3d6;word-break:keep-all}
a{color:#c05a2e}a:hover{color:#8f3f1c}
@keyframes kk-idle{0%,100%{transform:rotate(-1.5deg) scale(1)}50%{transform:rotate(1.5deg) scale(1.04)}}
</style></helmet>
<div style="position:relative;width:1194px;height:834px;overflow:hidden;background:#f6f2e8;font-family:'Gowun Dodum',sans-serif;color:#55534a;user-select:none">

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;inset:0">
  <img src="src/screen-4.jpg" alt="팝업북 표지" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,242,232,.82) 0%,rgba(246,242,232,.12) 30%,rgba(63,61,55,.42) 58%,rgba(63,61,55,.86) 100%)"></div>

  <div style="position:absolute;top:34px;left:44px;display:flex;align-items:center;gap:14px">
    <img src="src/logo.png" alt="Kiketch 로고" style="width:64px;height:64px;object-fit:contain">
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:38px;line-height:1;letter-spacing:.02em;color:#55534a">KIKETCH</div>
      <div style="font-size:14px;color:#6f6b5f">우리 아이 정서 발달 놀이북</div>
    </div>
  </div>

  <div style="position:absolute;left:50%;bottom:72px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 44px;background:#3f3d37;border-radius:30px">
    <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:38px;line-height:1.15;color:#f6f2e8">오늘은 어떤 이야기를 그릴까?</div>
    <button onClick="{{ goChapter }}" style="height:104px;padding:0 62px;border:4px solid #55534a;border-radius:52px;background:#f6c445;box-shadow:0 8px 0 #55534a;font-family:'Gaegu',cursive;font-weight:700;font-size:44px;line-height:1;white-space:nowrap;color:#55534a;cursor:pointer" style-active="transform:translateY(6px);box-shadow:0 2px 0 #55534a">그림책 펼치기</button>
  </div>
</div>
</sc-if>

<sc-if value="{{ isChapter }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:#f6f2e8">
  <img src="src/screen-2.jpg" alt="저녁 언덕" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div style="position:absolute;inset:0;background:rgba(63,61,55,.6)"></div>

  <div style="position:absolute;top:38px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 40px;background:#3f3d37;border-radius:26px">
    <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:46px;line-height:1.1;color:#f6f2e8">어디로 갈까?</div>
    <div style="font-size:16px;color:#f6f2e8">그림을 눌러보세요 · 글자를 읽지 않아도 됩니다</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:200px;display:flex;justify-content:center;gap:56px">
    <sc-for list="{{ chapters }}" as="ch" hint-placeholder-count="2">
      <button onClick="{{ ch.pick }}" style="{{ ch.cardStyle }}" style-hover="transform:translateY(-10px) rotate(0deg)">
        <div style="{{ ch.thumbStyle }}">
          <img src="{{ ch.img }}" alt="{{ ch.name }}" style="width:100%;height:100%;object-fit:cover;display:block">
        </div>
        <div style="display:flex;align-items:center;gap:14px;padding:0 4px">
          <div style="width:54px;height:54px;flex:none;border:3px solid #55534a;border-radius:50%;background:#f6f2e8;display:flex;align-items:center;justify-content:center;font-size:22px">▶</div>
          <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:34px;color:#55534a">{{ ch.name }}</div>
        </div>
      </button>
    </sc-for>
  </div>

  <button onClick="{{ goHome }}" style="position:absolute;bottom:34px;left:44px;height:56px;padding:0 24px;border:3px solid #f6f2e8;border-radius:28px;background:#3f3d37;font-family:'Gowun Dodum',sans-serif;font-size:18px;line-height:1;white-space:nowrap;color:#f6f2e8;cursor:pointer">← 책장</button>
</div>
</sc-if>

<sc-if value="{{ isHill }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0">
  <img src="src/screen-1.jpg" alt="봄 언덕 · 빈 자리 두 곳" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">

  <sc-for list="{{ slots }}" as="s" hint-placeholder-count="2">
    <button onClick="{{ s.pick }}" style="{{ s.style }}" style-hover="transform:rotate(0deg) scale(1.03)">
      <div style="{{ s.plusStyle }}">+</div>
      <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:26px;line-height:1.2;color:#55534a">{{ s.label }}</div>
    </button>
  </sc-for>

  <sc-if value="{{ hasDrawing }}" hint-placeholder-val="{{ false }}">
    <div style="{{ drawnStyle }}">
      <div style="{{ drawnInnerStyle }}">
        <sc-for list="{{ marks }}" as="m" hint-placeholder-count="0">
          <div style="{{ m.style }}"></div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;top:34px;left:50%;transform:translateX(-50%);padding:16px 34px;background:#3f3d37;border-radius:24px">
    <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:42px;line-height:1.1;color:#f6f2e8">빈 자리를 눌러 그려보자</div>
  </div>

  <button onClick="{{ goChapter }}" style="position:absolute;bottom:34px;left:44px;height:56px;padding:0 24px;border:3px solid #55534a;border-radius:28px;background:#f6f2e8;font-family:'Gowun Dodum',sans-serif;font-size:18px;line-height:1;white-space:nowrap;color:#55534a;cursor:pointer" style-hover="background:#ecd489">← 다른 이야기</button>
</div>
</sc-if>

<sc-if value="{{ isSketch }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0">
  <img src="src/screen-3.jpg" alt="색연필과 스케치북" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">

  <div style="{{ paperStyle }}" onPointerDown="{{ startDraw }}" onPointerMove="{{ moveDraw }}" onPointerUp="{{ endDraw }}" onPointerLeave="{{ endDraw }}">
    <sc-for list="{{ marks }}" as="m" hint-placeholder-count="0">
      <div style="{{ m.style }}"></div>
    </sc-for>
    <div style="{{ paperHintStyle }}">{{ paperHint }}</div>
  </div>

  <div style="position:absolute;top:30px;right:34px;padding:14px 24px;border-radius:22px;background:#3f3d37">
    <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:32px;line-height:1.1;color:#f6f2e8">{{ sketchTitle }}</div>
  </div>

  <div style="position:absolute;bottom:34px;right:34px;display:flex;align-items:center;gap:14px">
    <button onClick="{{ clearDraw }}" style="width:64px;height:64px;border:3px solid #55534a;border-radius:50%;background:#f6f2e8;font-size:24px;line-height:1;color:#55534a;cursor:pointer" style-hover="background:#ecd489">↺</button>
    <button onClick="{{ finishDraw }}" style="{{ finishStyle }}">언덕에 붙이기</button>
  </div>

  <button onClick="{{ goHill }}" style="position:absolute;bottom:34px;left:34px;height:56px;padding:0 24px;border:3px solid #55534a;border-radius:28px;background:#f6f2e8;font-family:'Gowun Dodum',sans-serif;font-size:18px;line-height:1;white-space:nowrap;color:#55534a;cursor:pointer" style-hover="background:#ecd489">← 언덕으로</button>
</div>
</sc-if>

<sc-if value="{{ isFilled }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0">
  <img src="src/screen-5.jpg" alt="해와 나무가 채워진 언덕" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div style="position:absolute;left:80px;top:46px;width:290px;height:300px;background:#b3d3e2;pointer-events:none"></div>
  <div style="{{ sunLayerStyle }}"></div>

  <div style="position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;gap:18px">
    <button onClick="{{ goSketch }}" style="height:72px;padding:0 34px;border:3px solid #55534a;border-radius:36px;background:#f6f2e8;font-family:'Gowun Dodum',sans-serif;font-size:20px;line-height:1;white-space:nowrap;color:#55534a;cursor:pointer" style-hover="background:#ecd489">다시 그리기</button>
    <button onClick="{{ goHill }}" style="height:72px;padding:0 40px;border:4px solid #55534a;border-radius:36px;background:#f6c445;box-shadow:0 6px 0 #55534a;font-family:'Gaegu',cursive;font-weight:700;font-size:32px;line-height:1;white-space:nowrap;color:#55534a;cursor:pointer" style-active="transform:translateY(5px);box-shadow:0 1px 0 #55534a">다음 자리 그리기</button>
  </div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:834},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;chapter&quot;,&quot;hill&quot;,&quot;sketch&quot;,&quot;filled&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'chapter'|'hill'|'sketch'|'filled'&quot;}}">
const INK = '#55534a', PAPER = '#f6f2e8';
const SLOTS = [
  { key: 'sun', label: '하늘', l: 79, t: 71, w: 294, h: 272, tilt: -1.5 },
  { key: 'tree', label: '언덕 위', l: 851, t: 231, w: 286, h: 272, tilt: 1.5 }
];
const CHAPTERS = [
  { key: 'day', name: '봄 언덕', img: 'src/screen-1.jpg', tilt: -3 },
  { key: 'dusk', name: '저녁 언덕', img: 'src/screen-2.jpg', tilt: 2.5 }
];
const PAPER_BOX = { l: 330, t: 128, w: 742, h: 560 };

class Component extends DCLogic {
  state = { screen: null, slot: null, points: [], drawing: false, done: false };

  get screen() { return this.state.screen ?? this.props.screen ?? 'home'; }
  go(s) { return () => this.setState({ screen: s }); }

  addPoint(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const scale = r.width / PAPER_BOX.w || 1;
    const x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
    this.setState(p => {
      const last = p.points[p.points.length - 1];
      if (last && Math.hypot(last.x - x, last.y - y) < 9) return null;
      if (p.points.length > 520) return null;
      return { points: p.points.concat({ x, y }) };
    });
  }

  renderVals() {
    const s = this.screen, st = this.state;
    const drew = st.points.length > 6;

    return {
      isHome: s === 'home', isChapter: s === 'chapter', isHill: s === 'hill',
      isSketch: s === 'sketch', isFilled: s === 'filled',
      goHome: this.go('home'), goChapter: this.go('chapter'), goHill: this.go('hill'),
      goSketch: this.go('sketch'),

      chapters: CHAPTERS.map(c => ({
        ...c,
        pick: () => this.setState({ screen: 'hill', done: false, points: [] }),
        cardStyle: { width: 330, display: 'flex', flexDirection: 'column', gap: 16, padding: 16, border: '3px solid ' + INK, borderRadius: 20, background: '#ecd489', boxShadow: '0 10px 0 rgba(63,61,55,.5)', cursor: 'pointer', textAlign: 'left', transform: 'rotate(' + c.tilt + 'deg)', transition: 'transform .18s ease', font: 'inherit' },
        thumbStyle: { height: 224, border: '3px solid ' + INK, borderRadius: 14, background: PAPER, overflow: 'hidden' }
      })),

      slots: SLOTS.filter(sl => !(st.done && sl.key === 'sun')).map(sl => ({
        label: sl.label,
        pick: () => this.setState({ screen: 'sketch', slot: sl.key, points: [] }),
        style: { position: 'absolute', left: sl.l, top: sl.t, width: sl.w, height: sl.h, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10, border: 'none', borderRadius: 6, background: 'transparent', cursor: 'pointer', transform: 'rotate(' + sl.tilt + 'deg)', transition: 'transform .18s ease', font: 'inherit' },
        plusStyle: { width: 84, height: 84, border: '4px solid ' + INK, borderRadius: '50%', background: 'rgba(246,242,232,.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Gaegu',cursive", fontWeight: 700, fontSize: 56, lineHeight: 1, color: INK }
      })),

      hasDrawing: st.done,
      drawnStyle: { position: 'absolute', left: SLOTS[0].l + 20, top: SLOTS[0].t + 16, width: 240, height: 200, transformOrigin: 'center', animation: 'kk-idle 4.6s ease-in-out infinite', pointerEvents: 'none' },
      drawnInnerStyle: { position: 'absolute', left: 0, top: 0, width: PAPER_BOX.w, height: PAPER_BOX.h, transform: 'scale(0.3235)', transformOrigin: 'top left' },
      sunLayerStyle: { position: 'absolute', left: 80, top: 46, width: 290, height: 300, backgroundImage: 'url(src/screen-5.jpg)', backgroundSize: '1194px 874px', backgroundPosition: '-80px -66px', transformOrigin: 'center', animation: 'kk-idle 4.6s ease-in-out infinite', pointerEvents: 'none' },

      sketchTitle: st.slot === 'tree' ? '언덕 위에 무엇을 그릴까?' : '하늘에 무엇을 그릴까?',
      paperStyle: { position: 'absolute', left: PAPER_BOX.l, top: PAPER_BOX.t, width: PAPER_BOX.w, height: PAPER_BOX.h, cursor: 'crosshair', touchAction: 'none' },
      marks: st.points.map(p => ({
        style: { position: 'absolute', left: p.x - 7, top: p.y - 7, width: 14, height: 14, borderRadius: '50%', background: '#e8734a' }
      })),
      paperHintStyle: { position: 'absolute', left: 0, right: 0, bottom: 28, textAlign: 'center', fontSize: 17, color: '#a9a396', opacity: drew ? 0 : 1, transition: 'opacity .3s', pointerEvents: 'none' },
      paperHint: '여기에 손가락으로 그려보세요',
      startDraw: e => { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); this.setState({ drawing: true }); this.addPoint(e); },
      moveDraw: e => { if (st.drawing) this.addPoint(e); },
      endDraw: () => { if (st.drawing) this.setState({ drawing: false }); },
      clearDraw: () => this.setState({ points: [] }),
      finishDraw: () => { if (drew) this.setState({ screen: 'filled', done: true }); },
      finishStyle: { height: 72, padding: '0 38px', border: '4px solid ' + INK, borderRadius: 36, background: drew ? '#f6c445' : 'rgba(246,242,232,.7)', boxShadow: drew ? '0 6px 0 ' + INK : 'none', fontFamily: "'Gaegu',cursive", fontWeight: 700, fontSize: 30, lineHeight: 1, whiteSpace: 'nowrap', color: INK, opacity: drew ? 1 : .55, cursor: drew ? 'pointer' : 'default' }
    };
  }
}
</script>
</body>
</html>
