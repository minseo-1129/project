<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
body{margin:0;background:#e9e3d6;word-break:keep-all}
a{color:#c05a2e}a:hover{color:#8f3f1c}
</style></helmet>
<div style="display:flex;gap:36px;align-items:flex-start;padding:36px 40px 80px;box-sizing:border-box;font-family:'Gowun Dodum',sans-serif;color:#55534a;background:#e9e3d6;flex-wrap:wrap">

  <div style="position:sticky;top:36px;flex:0 0 762px;max-height:calc(100vh - 72px);overflow:auto;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="src/logo.png" alt="Kiketch 로고" style="width:44px;height:44px;object-fit:contain">
      <div>
        <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:30px;line-height:1.05">Kiketch 프로토타입</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:#6f6b5f">iPad 11" · 1194×834 · 실제로 눌러보세요</div>
      </div>
    </div>

    <div style="padding:20px;border:4px solid #55534a;border-radius:34px;background:#3f3d37;box-shadow:0 12px 0 rgba(85,83,74,.35)">
      <div style="position:relative;width:718px;height:502px;border-radius:18px;overflow:hidden;background:#f6f2e8">
        <div style="position:absolute;top:0;left:0;width:1194px;height:834px;transform:scale(0.6015);transform-origin:top left;text-align:left">
          <dc-import name="KiketchScreen" screen="{{ screen }}" hint-size="1194px,834px"></dc-import>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border:3px solid #55534a;border-radius:20px;background:#f6f2e8">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:#6f6b5f">FLOW</div>
      <sc-for list="{{ flowChips }}" as="c" hint-placeholder-count="6">
        <button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
      </sc-for>
    </div>

    <div style="padding:18px 20px;border:3px dashed #c05a2e;border-radius:18px;background:#fdf6e6;font-size:14px;line-height:1.65">
      <b>핵심 인터랙션:</b> 언덕의 빈 포스트잇을 누르면 스케치북이 열리고, 종이 위에 <b>직접 그릴 수 있습니다</b>. “언덕에 붙이기”를 누르면 포스트잇이 사라진 자리에 그린 그림이 채색된 상태로 붙고, 살짝 움직입니다.
    </div>
  </div>

  <div style="flex:1;min-width:320px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:32px">화면 5</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:#6f6b5f">SCREEN GALLERY — 썸네일을 누르면 왼쪽에 뜹니다</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,300px);gap:22px">
      <sc-for list="{{ gallery }}" as="g" hint-placeholder-count="6">
        <button onClick="{{ g.pick }}" style="{{ g.cardStyle }}" style-hover="transform:translateY(-6px)">
          <div style="{{ g.frameStyle }}">
            <div style="{{ g.innerStyle }}">
              <dc-import name="KiketchScreen" screen="{{ g.key }}" hint-size="1194px,834px"></dc-import>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;padding:0 4px">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:#c05a2e">{{ g.tag }}</div>
            <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:24px;line-height:1.1;color:#55534a">{{ g.name }}</div>
            <div style="font-size:13px;line-height:1.5;color:#6f6b5f">{{ g.note }}</div>
          </div>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const INK = '#55534a';
const SCREENS = [
  { key: 'home', tag: '01 HOME', name: '홈 / 책장', note: '팝업북 표지 · 버튼 하나' },
  { key: 'chapter', tag: '02 CHAPTER', name: '챕터 선택', note: '글자 없이 그림으로만 고른다' },
  { key: 'hill', tag: '03 HILL', name: '언덕 · 빈 자리', note: '포스트잇 = 그릴 자리. 눌러서 진입' },
  { key: 'sketch', tag: '04 SKETCHBOOK', name: '스케치북', note: '종이에 직접 그려집니다' },
  { key: 'filled', tag: '05 FILLED', name: '언덕에 붙은 그림', note: '자리에 붙고 살짝 움직인다' }
];

class Component extends DCLogic {
  state = { screen: 'home' };
  renderVals() {
    const cur = this.state.screen;
    return {
      screen: cur,
      flowChips: SCREENS.map((s, i) => ({
        label: String(i + 1).padStart(2, '0'),
        pick: () => this.setState({ screen: s.key }),
        style: { width: 46, height: 46, border: '3px solid ' + INK, borderRadius: '50%', background: cur === s.key ? '#f6c445' : '#fff', fontFamily: "'IBM Plex Mono',monospace", fontSize: 13, color: INK, cursor: 'pointer' }
      })),
      gallery: SCREENS.map(s => ({
        ...s,
        pick: () => this.setState({ screen: s.key }),
        cardStyle: { display: 'flex', flexDirection: 'column', gap: 12, padding: 12, border: '3px solid ' + INK, borderRadius: 20, background: cur === s.key ? '#ecd489' : '#f6f2e8', boxShadow: cur === s.key ? '0 8px 0 ' + INK : '0 6px 0 rgba(85,83,74,.3)', cursor: 'pointer', textAlign: 'left', font: 'inherit', transition: 'transform .16s ease, background .2s' },
        frameStyle: { position: 'relative', width: 272, height: 190, border: '3px solid ' + INK, borderRadius: 12, overflow: 'hidden', background: '#f6f2e8' },
        innerStyle: { position: 'absolute', top: 0, left: 0, width: 1194, height: 834, transform: 'scale(0.2278)', transformOrigin: 'top left', textAlign: 'left', pointerEvents: 'none' }
      }))
    };
  }
}
</script>
</body>
</html>
