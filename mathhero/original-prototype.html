<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css"><style>
body{margin:0;background:#08090f}
*{box-sizing:border-box}
a{color:#46e0d2;text-decoration:none}
a:hover{color:#ffc247}
button{font:inherit;color:inherit;cursor:pointer}
</style></helmet>

<div style="display:flex;gap:28px;padding:28px 32px;background:#08090f;font-family:Galmuri11,monospace;color:#f4f2e6;align-items:flex-start;min-height:100vh;min-width:1460px">

<div style="width:1000px;flex:none;position:sticky;top:28px">
<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px">
<div>
<div style="font-family:Galmuri14,monospace;font-size:26px;color:#f4f2e6">MATHHERO 프로토타입</div>
<div style="font-family:Galmuri11,monospace;font-size:13px;color:#5a6bc4;margin-top:6px">TABLET 1280×800 · 실제로 눌러보세요 · 오른쪽에서 화면 점프</div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<div style="font-family:Galmuri11,monospace;font-size:13px;color:#46e0d2;background:#0e1020;border:3px solid #33407e;padding:8px 12px">{{ curLabel }}</div>
<button onClick="{{ reset }}" style="background:#1a2142;border:3px solid #33407e;padding:9px 14px;font-family:Galmuri11,monospace;font-size:14px;color:#8f9bd6">처음으로</button>
</div>
</div>
<div style="width:1000px;height:632px;border:8px solid #1a2142;background:#0e1020;box-shadow:0 0 0 3px #33407e,0 10px 0 rgba(0,0,0,.6);overflow:hidden;position:relative">
<div style="width:1280px;height:800px;transform:scale(0.7734);transform-origin:top left">
<dc-import name="MathHeroScreen" screen="{{ cur }}" onNavigate="{{ nav }}" hint-size="1280px,800px"></dc-import>
</div>
</div>
<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{ flowSteps }}" as="f" hint-placeholder-count="6">
<button onClick="{{ f.go }}" style="background:{{ f.bg }};border:3px solid {{ f.bd }};color:{{ f.fg }};padding:9px 13px;font-family:Galmuri11,monospace;font-size:14px">{{ f.label }}</button>
</sc-for>
</div>
<div style="margin-top:14px;font-family:Galmuri11,monospace;font-size:13px;color:#5a6bc4;line-height:2">
핵심 플로우 — 내 방(오답 수조 3) → 맵(복습 구역 상시) → 지역 보드(출격/연습 분리) → 문제(즉시 판정 + 코비 해설) → 클리어(놓친 버그 → 복습 CTA) → 오답 수조<br>
원본과 달라진 지점은 각 화면의 시안 노트를 참고하세요.
</div>
</div>

<div style="width:368px;flex:none">
<div style="font-family:Galmuri14,monospace;font-size:19px;color:#f4f2e6;margin-bottom:6px">화면 목록</div>
<div style="font-family:Galmuri11,monospace;font-size:13px;color:#5a6bc4;margin-bottom:16px">10 SCREENS · 클릭하면 왼쪽 태블릿이 이동합니다</div>
<div style="display:flex;flex-direction:column;gap:14px">
<sc-for list="{{ gallery }}" as="g" hint-placeholder-count="10">
<button onClick="{{ g.go }}" style="text-align:left;background:{{ g.bg }};border:3px solid {{ g.bd }};padding:10px;display:block;width:100%">
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
<div style="font-family:Galmuri11,monospace;font-size:13px;color:{{ g.idFg }}">{{ g.id }}</div>
<div style="font-family:Galmuri11,monospace;font-size:15px;color:#f4f2e6">{{ g.name }}</div>
</div>
<div style="width:100%;height:212px;overflow:hidden;border:2px solid #0e1020;background:#0e1020;position:relative;text-align:left">
<div style="width:1280px;height:800px;transform:scale(0.2648);transform-origin:top left;text-align:left;pointer-events:none">
<dc-import name="MathHeroScreen" screen="{{ g.key }}" hint-size="1280px,800px"></dc-import>
</div>
</div>
<div style="margin-top:8px;font-family:Galmuri11,monospace;font-size:13px;color:#8f9bd6;line-height:1.7">{{ g.note }}</div>
</button>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1460,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { cur: 'main' };

  renderVals() {
    const cur = this.state.cur;
    const go = k => () => this.setState({ cur: k });

    const screens = [
      ['01', 'main', '메인 · 내 방', '실제 방 그대로 — 책상 모니터=접속, 수조=오답 복습, 창밖은 접속 시간대에 따라 바뀝니다.'],
      ['02', 'map', '맵 · 차원 선택', '복습 구역이 맵에 상시 노드로 존재. 난이도는 색 대신 라벨로 명시.'],
      ['03', 'region', '지역 설명 보드', '출격(파워 1)과 연습(파워 0)을 분리 — 파워가 없어도 학습은 계속된다.'],
      ['04', 'play', '문제 풀이', '좌측 스테이지는 작게, 우측 문제·힌트가 주역. 선지에 수량 점 표시 · 시간 제한 없음.'],
      ['05', 'clear', '스테이지 클리어', '결과 뒤에 "놓친 버그 1마리 → 지금 복습" CTA가 가장 큰 버튼.'],
      ['06', 'review', '복습 · 오답 수조', '원본에 없던 화면. 방 수조의 오답을 유형으로 묶어 한 번에 연습.'],
      ['07', 'board', '리더보드', '기본 탭이 우리 클랜. 지표는 정답률 대신 푼 문제 수. 개인 정답률은 비공개.'],
      ['08', 'profile', '프로필', '단원별 상태를 "튼튼해요 / 한 번 더 / 버그 3마리"로 — 아동이 읽을 수 있는 말로.'],
      ['09', 'clan', '클랜 아지트 · 보드', '같은 학교 파티 유지. 소집은 경쟁이 아니라 보스 공동 방어.'],
      ['10', 'tutorial', '튜토리얼 · 수준 평가', '"잘 모르겠어요" 선택지 추가 — 찍기를 배제해 진단 정확도를 높인다.']
    ];

    const labels = {};
    screens.forEach(s => { labels[s[1]] = s[0] + ' ' + s[2]; });

    const gallery = screens.map(s => ({
      id: s[0], key: s[1], name: s[2], note: s[3],
      bg: cur === s[1] ? '#0b2a3d' : '#0e1020',
      bd: cur === s[1] ? '#46e0d2' : '#1a2142',
      idFg: cur === s[1] ? '#46e0d2' : '#5a6bc4',
      go: go(s[1])
    }));

    const flow = ['main', 'map', 'region', 'play', 'clear', 'review'];
    const flowSteps = flow.map((k, i) => ({
      label: (i + 1) + '. ' + labels[k].slice(3),
      bg: cur === k ? '#ffc247' : '#1a2142',
      bd: cur === k ? '#0e1020' : '#33407e',
      fg: cur === k ? '#0e1020' : '#8f9bd6',
      go: go(k)
    }));

    return {
      cur,
      curLabel: labels[cur] || cur,
      gallery,
      flowSteps,
      nav: k => this.setState({ cur: k }),
      reset: () => this.setState({ cur: 'main' })
    };
  }
}
</script>
</body>
</html>
