<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #E7E7E2; font-family: 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #2547D0; text-decoration: none; }
  a:hover { color: #12203A; }
</style>
</helmet>
<div style="min-height:100vh;background:#E7E7E2;color:#12203A;padding:32px 36px 80px;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif">

  <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:20px;border-bottom:1px solid rgba(18,32,58,0.14);padding-bottom:22px;margin-bottom:32px">
    <div>
      <div style="font-family:'IBM Plex Mono','Noto Sans KR',monospace;font-size:11px;color:#2547D0;letter-spacing:0.16em;margin-bottom:10px">ORBIT · INTERACTIVE PROTOTYPE</div>
      <div style="font-size:26px;font-weight:700;letter-spacing:-0.025em">단계에 따라 갈리는 두 개의 플로우</div>
    </div>
    <div style="display:flex;gap:6px;background:#FBFBF9;padding:5px;border-radius:999px;border:1px solid rgba(18,32,58,0.1)">
      <button onClick="{{ setBeginner }}" style="border:0;cursor:pointer;padding:11px 22px;border-radius:999px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;background:{{ bgBeginner }};color:{{ fgBeginner }}">입문자 · Stage 3</button>
      <button onClick="{{ setAdvanced }}" style="border:0;cursor:pointer;padding:11px 22px;border-radius:999px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;background:{{ bgAdvanced }};color:{{ fgAdvanced }}">숙련자 · Stage 5</button>
    </div>
  </div>

  <div style="display:flex;gap:44px;align-items:flex-start">

    <div style="flex:0 0 400px;position:sticky;top:24px;max-height:calc(100vh - 72px);overflow:auto;scrollbar-width:none">
      <div style="border-radius:40px;background:#FBFBF9;border:1px solid rgba(18,32,58,0.16);padding:12px;width:384px;box-sizing:border-box;margin-bottom:18px">
        <div style="border-radius:30px;overflow:hidden;width:360px;height:780px">
          <dc-import name="ORBITScreen" screen="{{ screen }}" hint-size="360px,780px"></dc-import>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin-bottom:12px">
        <div>
          <div style="font-family:'IBM Plex Mono','Noto Sans KR',monospace;font-size:10px;color:#545E6E;letter-spacing:0.1em;margin-bottom:6px">{{ stepLabel }}</div>
          <div style="font-size:16px;font-weight:700">{{ title }}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button onClick="{{ prev }}" style="border:1px solid rgba(18,32,58,0.16);background:#FBFBF9;color:#12203A;width:40px;height:40px;border-radius:999px;cursor:pointer;font-size:14px">‹</button>
          <button onClick="{{ next }}" style="border:0;background:#2547D0;color:#fff;width:40px;height:40px;border-radius:999px;cursor:pointer;font-size:14px">›</button>
        </div>
      </div>
      <div style="padding:16px 18px;border-radius:18px;background:#FBFBF9;border:1px solid rgba(18,32,58,0.09);font-size:13px;font-weight:400;color:#3A4759;line-height:1.7;text-wrap:pretty">{{ note }}</div>
    </div>

    <div style="flex:1;min-width:0">
      <div style="font-family:'IBM Plex Mono','Noto Sans KR',monospace;font-size:10px;color:#545E6E;letter-spacing:0.14em;margin-bottom:20px">{{ flowLabel }}</div>
      <div style="display:flex;flex-wrap:wrap;gap:20px">
        <sc-for list="{{ steps }}" as="step" hint-placeholder-count="8">
          <button onClick="{{ step.go }}" style="text-align:left;padding:0;cursor:pointer;background:transparent;border:0;display:flex;flex-direction:column;gap:10px">
            <div style="width:198px;height:429px;border-radius:22px;overflow:hidden;background:#FBFBF9;border:2px solid {{ step.border }};position:relative;text-align:left">
              <div style="width:360px;height:780px;transform:scale(0.55);transform-origin:top left;text-align:left;pointer-events:none">
                <dc-import name="ORBITScreen" screen="{{ step.id }}" hint-size="360px,780px"></dc-import>
              </div>
            </div>
            <div style="width:198px;text-align:left">
              <div style="font-family:'IBM Plex Mono','Noto Sans KR',monospace;font-size:10px;color:#545E6E;letter-spacing:0.1em;margin-bottom:5px">{{ step.num }}</div>
              <div style="font-size:12px;font-weight:500;color:{{ step.fg }};line-height:1.45">{{ step.title }}</div>
            </div>
          </button>
        </sc-for>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const FLOWS = {
  beginner: [
    ['intro', '진입', '예측을 먼저 약속합니다. 기록을 다 채운 다음이 아니라.'],
    ['profile', '기본 정보', '원본과 동일. 4단계 중 1단계임을 모노 캡션으로 명시했습니다.'],
    ['stage', '행동 변화 단계 진단', '원본에서 반드시 살린 요소. 5단계 설문 문항은 그대로 두고, "답에 따라 앱 전체가 달라진다"는 문장을 추가했습니다.'],
    ['stageResult', '단계 결과 · 신규', '원본에 없던 화면. 단계를 물어놓고 아무 말도 하지 않던 침묵을 메웁니다. 이 단계에서 앱이 무엇을 바꾸는지 3줄로 약속합니다.'],
    ['goalPurpose', '목적 · 도움 영역', '원본의 두 화면을 하나로 합쳤습니다. 둘 다 같은 칩 컴포넌트였고 스크롤 여유가 있었습니다.'],
    ['routinePick', '루틴 하나 고르기', '입문자 분기. 원본 그대로 — 인터뷰에서 "선택지를 주면서 일단 이끌어 줬으면 좋겠어"에 정확히 대응하던 화면입니다.'],
    ['forecastPreview', '시작 전 예상 변화 · 축', '리디자인의 핵심. 원본에서 계산기 뒤에 묻혀 있던 예상 변화를 온보딩 마지막 화면으로 끌어올렸습니다. 두 타입 모두 가장 높게 평가한 기능을 가장 먼저 만나게 합니다.'],
    ['homeDay0', '홈 · 첫 날 · 신규', '예상 변화를 홈 최상단에 올린 대가로 생긴 화면. 기록이 0일 때 남의 평균으로 궤도를 그리면 약속이 거짓이 됩니다. 대신 잠근 상태를 그대로 보여주고 3일 카운트다운을 겁니다.'],
    ['homeBeginner', '홈 · 입문자', '예상 변화가 상단 고정. 그 아래는 "이번 주에 지킨 것" — 원본의 "?시간 ?분" 빈칸 대신 채운 칸만 셉니다.'],
    ['log', '기록', '원본 구조 유지. 상단에 체감 난이도 3단계를 추가했습니다.'],
    ['logAdd', '기록 항목 추가', '단계에 따라 항목이 잠깁니다. 체지방률·골격근량은 Stage 4부터 열립니다.'],
    ['forecast', '예상 변화', '원본의 지난 주 / 이번 주 대조 카드를 유지했습니다.'],
    ['selfCompare', '지난 주의 나 · 신규', '원본 "나의 건강 위치"의 기준점을 참여자 평균에서 지난 주 나로 바꿨습니다. 커뮤니티를 걷어낸 자리를 대체합니다.'],
    ['report', '주간 리포트', '입문자에게도 체성분 차트를 보여주던 원본과 달리, 여기서는 Stage 3 기준 항목만 노출됩니다.'],
    ['routineEdit', '루틴 관리', '두 번째 루틴은 11일 뒤 열립니다. 한 번에 하나만.'],
    ['stageUp', '단계 승급 · 신규', '단계에 따라 앱이 달라진다고 온보딩에서 약속했으니, 단계가 바뀌는 순간에도 무엇이 달라지는지 말해야 합니다. 추가·심화·축소 세 가지를 명시합니다.'],
    ['me', '나', '단계는 언제든 다시 진단. 화면 밀도를 사용자가 직접 조절합니다.']
  ],
  advanced: [
    ['intro', '진입', '동일한 진입점. 분기는 단계 진단 이후에 일어납니다.'],
    ['profile', '기본 정보', '원본과 동일.'],
    ['stage', '행동 변화 단계 진단', '같은 설문, 다른 결과. 4·5번을 고르면 숙련자 플로우로 갈립니다.'],
    ['stageResult', '단계 결과 · 신규', '유지 단계에서는 "목표선 대비"가 기준이 된다는 것을 미리 알립니다.'],
    ['goalPurpose', '목적 · 도움 영역', '입문자와 공유하는 화면.'],
    ['concern', '고민 입력', '원본의 음성 문답을 텍스트 입력 + 태그 추출로 대체했습니다. 당시 구현되지 않은 STT 의존을 제거하면서, 인터뷰에서 호평받은 "일단 어려움을 먼저 물어봐서 좋다"는 순서는 지켰습니다.'],
    ['routineDetail', '루틴 상세 설정', '숙련자 분기. 일정·시간대·종류를 직접 지정합니다. 원본 그대로.'],
    ['forecastPreview', '시작 전 예상 변화 · 축', '숙련자도 같은 약속을 먼저 받습니다.'],
    ['homeAdvanced', '홈 · 숙련자', '예상 변화가 목표일 카운트다운으로 바뀝니다. 하단에 코칭 한 줄 — 원본에서 깊은 화면에만 있던 정보입니다.'],
    ['log', '기록', '입문자와 같은 화면, 항목만 더 열려 있습니다.'],
    ['report', '주간 리포트', '체성분·식단 차트. Stage 5에서만 전체가 열립니다.'],
    ['forecastAdvanced', '체성분 예측', '원본에서 반드시 살린 예측 그래프. 코칭 카드에 "며칠 단축"을 붙여 행동과 결과를 직접 연결했습니다.'],
    ['forecastCalc', '목표 계산기', '원본 유지. 다만 이제는 예상 변화의 입구가 아니라, 이미 본 예측을 조정하는 도구입니다.'],
    ['selfCompare', '지난 주의 나 · 신규', '인터뷰에서 숙련자가 선호한 개인 내 비교. 원본에는 참여자 평균 비교만 있었습니다.'],
    ['routineEdit', '루틴 관리', '숙련자는 복수 루틴을 동시에 운용합니다.'],
    ['stageUp', '단계 승급 · 신규', '입문자와 같은 화면. 숙련자는 이 화면을 통해 Stage 5의 전체 리포트가 열립니다.'],
    ['me', '나', '동일.']
  ]
};

class Component extends DCLogic {
  state = { mode: 'beginner', i: 0 };

  pick(mode) { this.setState({ mode: mode, i: 0 }); }
  jump(i) { this.setState({ i: i }); }

  renderVals() {
    const mode = this.state.mode;
    const flow = FLOWS[mode];
    const i = Math.min(this.state.i, flow.length - 1);
    const cur = flow[i];
    const pad = function (n) { return n < 10 ? '0' + n : String(n); };
    const self = this;
    return {
      screen: cur[0],
      title: cur[1],
      note: cur[2],
      stepLabel: pad(i + 1) + ' / ' + pad(flow.length),
      flowLabel: mode === 'beginner'
        ? 'BEGINNER FLOW · STAGE 3 · ' + flow.length + ' SCREENS'
        : 'ADVANCED FLOW · STAGE 5 · ' + flow.length + ' SCREENS',
      bgBeginner: mode === 'beginner' ? '#12203A' : 'transparent',
      fgBeginner: mode === 'beginner' ? '#fff' : '#545E6E',
      bgAdvanced: mode === 'advanced' ? '#12203A' : 'transparent',
      fgAdvanced: mode === 'advanced' ? '#fff' : '#545E6E',
      setBeginner: function () { self.pick('beginner'); },
      setAdvanced: function () { self.pick('advanced'); },
      prev: function () { self.setState({ i: (i - 1 + flow.length) % flow.length }); },
      next: function () { self.setState({ i: (i + 1) % flow.length }); },
      steps: flow.map(function (s, n) {
        return {
          id: s[0],
          title: s[1],
          num: pad(n + 1),
          border: n === i ? '#2547D0' : 'rgba(18,32,58,0.12)',
          fg: n === i ? '#2547D0' : '#3A4759',
          go: function () { self.jump(n); }
        };
      })
    };
  }
}
</script>
</body>
</html>
