<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#E7E7E1; font-family:'Pretendard Variable',Pretendard,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#4A5A3C; text-decoration:none; }
  a:hover { color:#14140F; }
  button { font-family:inherit; }
</style>
</helmet>
<div style="display:flex; gap:48px; align-items:flex-start; padding:40px 48px 96px; max-width:1560px;">

  <div style="flex:none; position:sticky; top:24px; max-height:calc(100vh - 72px); overflow:auto; display:flex; flex-direction:column; gap:16px;">
    <div style="flex:none; display:flex; align-items:baseline; justify-content:space-between; width:393px;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:#4A5A3C;">PICO / PROTOTYPE</div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#6B6B63;">{{ counter }}</div>
    </div>
    <div style="flex:none; width:393px; height:852px; border:1px solid #C9C9C0; background:#FAFAF8; overflow:hidden;">
      <dc-import name="PicoScreen" screen="{{ current }}" hint-size="393px,852px"></dc-import>
    </div>
    <div style="flex:none; width:393px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <div style="font-size:14px; font-weight:600; letter-spacing:-0.01em;">{{ currentLabel }}</div>
      <div style="display:flex; gap:6px;">
        <button onClick="{{ prev }}" style="width:38px; height:34px; border:1px solid #C9C9C0; background:#FAFAF8; color:#14140F; font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;">‹</button>
        <button onClick="{{ next }}" style="width:38px; height:34px; border:1px solid #C9C9C0; background:#FAFAF8; color:#14140F; font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;">›</button>
      </div>
    </div>
  </div>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:44px; padding-top:2px;">
    <div>
      <div style="font-size:30px; font-weight:700; letter-spacing:-0.03em;">네 개의 흐름</div>
      <div style="margin-top:10px; max-width:640px; font-size:15px; line-height:1.7; color:#6B6B63; text-wrap:pretty;">
        등록의 마찰을 줄이고, 매일 밤의 의식을 화면의 주인공으로 올리는 것 — 리디자인의 두 축을 네 흐름으로 확인한다.
        썸네일을 누르면 왼쪽 화면이 바뀐다.
      </div>
    </div>

    <sc-for list="{{ flows }}" as="f" hint-placeholder-count="4">
      <div>
        <div style="display:flex; align-items:baseline; gap:16px; padding-bottom:14px; border-bottom:1px solid #C9C9C0;">
          <div style="flex:none; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#4A5A3C;">{{ f.no }}</div>
          <div style="flex:none; white-space:nowrap; font-size:18px; font-weight:700; letter-spacing:-0.02em;">{{ f.title }}</div>
          <div style="flex:1; min-width:0; font-size:13.5px; line-height:1.5; color:#6B6B63; text-wrap:pretty;">{{ f.note }}</div>
        </div>
        <div style="padding-top:18px; display:flex; flex-wrap:wrap; gap:20px;">
          <sc-for list="{{ f.items }}" as="it" hint-placeholder-count="3">
            <button onClick="{{ it.onClick }}" style="all:unset; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:9px;">
              <div style="width:151px; height:328px; overflow:hidden; background:#FAFAF8; border:1px solid {{ it.border }}; box-shadow:{{ it.shadow }}; text-align:left;">
                <div style="width:393px; height:852px; transform:scale(0.385); transform-origin:top left; text-align:left;">
                  <dc-import name="PicoScreen" screen="{{ it.screen }}" hint-size="393px,852px"></dc-import>
                </div>
              </div>
              <div style="display:flex; flex-direction:column; gap:3px; width:151px;">
                <div style="font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.1em; color:{{ it.idColor }};">{{ it.code }}</div>
                <div style="font-size:12.5px; font-weight:600; color:{{ it.labelColor }}; letter-spacing:-0.01em;">{{ it.label }}</div>
              </div>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { screen: 'home' };

  order() {
    return ['onboarding','capture','confirm','home','outfit','shop','wardrobe','item','notify','time','my'];
  }

  go = (s) => this.setState({ screen: s });

  step(d) {
    const o = this.order();
    const i = (o.indexOf(this.state.screen) + d + o.length) % o.length;
    this.setState({ screen: o[i] });
  }

  renderVals() {
    const cur = this.state.screen;
    const meta = {
      onboarding: { code: '01 · ONBOARDING', label: '가치 제안' },
      capture: { code: '02 · CAPTURE', label: '옷 촬영' },
      confirm: { code: '03 · CONFIRM', label: 'AI 인식 확인' },
      home: { code: '04 · TONIGHT', label: '오늘 밤의 세 벌' },
      outfit: { code: '05 · SET DETAIL', label: '코디 상세' },
      shop: { code: '06 · NEEDS', label: '없는 아이템 제안' },
      wardrobe: { code: '07 · CLOSET', label: '옷장 격자' },
      item: { code: '08 · ITEM', label: '아이템 명세' },
      notify: { code: '09 · ALERTS', label: '알림 기록' },
      time: { code: '10 · SCHEDULE', label: '도착 시간 변경' },
      my: { code: '11 · REPORT', label: '옷장 리포트' }
    };
    const item = (s) => ({
      screen: s,
      code: meta[s].code,
      label: meta[s].label,
      onClick: () => this.go(s),
      border: s === cur ? '#4A5A3C' : '#C9C9C0',
      shadow: s === cur ? '0 0 0 2px #4A5A3C' : 'none',
      idColor: s === cur ? '#4A5A3C' : '#8E8E85',
      labelColor: s === cur ? '#14140F' : '#4A4A42'
    });
    const o = this.order();
    return {
      current: cur,
      currentLabel: meta[cur].label,
      counter: (o.indexOf(cur) + 1) + ' / ' + o.length,
      prev: () => this.step(-1),
      next: () => this.step(1),
      flows: [
        { no: 'FLOW 01', title: '옷장 만들기', note: '첫 화면에서 선택지를 없애고 촬영으로 바로 보낸다',
          items: [item('onboarding'), item('capture'), item('confirm')] },
        { no: 'FLOW 02', title: '밤 10시의 의식', note: '캐러셀 한 줄이 아니라 화면 전체가 코디다',
          items: [item('home'), item('outfit'), item('shop')] },
        { no: 'FLOW 03', title: '재고로서의 옷장', note: 'ID·색·사이즈·착용 횟수가 한 격자에서 읽힌다',
          items: [item('wardrobe'), item('item'), item('my')] },
        { no: 'FLOW 04', title: '도착 시간 바꾸기', note: '의식의 시간을 사용자가 직접 정한다',
          items: [item('notify'), item('time')] }
      ]
    };
  }
}

</script>
</body>
</html>
