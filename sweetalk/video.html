<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sweetalk · Prototype video</title>
<style>
html,body{margin:0;height:100%;background:#f7f4f6}
body{display:flex;align-items:center;justify-content:center;font:15px/1.5 system-ui,sans-serif;color:#555}
video{display:block;width:100%;height:100%;object-fit:contain;background:#f7f4f6}
</style></head>
<body>
<!-- The shell passes the selected screen as ?portfolioState=intro|usecase. -->
<video id="v" controls playsinline preload="metadata">프로토타입 영상을 재생할 수 없습니다.</video>
<script>
const videos = {intro: 'intro', usecase: 'usecase'};
const state = new URLSearchParams(location.search).get('portfolioState');
const name = videos[state] || 'intro';
const v = document.getElementById('v');
v.poster = `assets/video/${name}.jpg`;
v.src = `assets/video/${name}.mp4`;
</script>
</body></html>
